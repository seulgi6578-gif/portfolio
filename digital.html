<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="한슬기 웹·디지털 디자인 포트폴리오 — 상세 페이지, 카드뉴스, 기업 웹사이트" />
  <title>웹·디지털 디자인 — 한슬기 포트폴리오</title>
  <style>
    :root{color-scheme:light;--paper:#f7f1ed;--ink:#30282a;--muted:#776a6c;--accent:#7562b0;--line:rgba(80,60,58,.14);--pad:clamp(22px,6vw,84px);--max:1240px}
    *{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--paper)}
    body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 8% 4%,rgba(222,212,248,.6),transparent 36%),radial-gradient(ellipse at 95% 32%,rgba(246,213,225,.4),transparent 34%),var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;line-height:1.6;letter-spacing:-.025em}
    a{color:inherit;text-decoration:none}button{font:inherit}
    .topbar{min-height:76px;padding:14px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);background:rgba(255,253,250,.56)}
    .brand{font-size:14px;font-weight:650;letter-spacing:.03em}.back-link{display:inline-flex;align-items:center;gap:9px;color:#6d5660;font-size:12px;transition:color .2s}.back-link:hover{color:var(--accent)}.back-link span{font-size:18px}
    main{width:min(var(--max),100%);margin:auto;padding:clamp(58px,9vw,120px) var(--pad) 112px}
    .intro{max-width:850px;margin:0 auto 62px;text-align:center}.eyebrow{margin:0 0 15px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.16em}
    h1{margin:0;font-size:clamp(38px,7vw,76px);font-weight:540;line-height:1.08;letter-spacing:-.065em}.intro-copy{max-width:620px;margin:22px auto 0;color:var(--muted);font-size:clamp(14px,1.6vw,17px);word-break:keep-all}
    .intro-rule{width:52px;height:1px;margin:30px auto 0;background:var(--accent)}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
    .section-heading h2{margin:0;font-size:15px;font-weight:600}.section-heading p{margin:0;color:var(--muted);font-size:11px}
    .project-section+.project-section{margin-top:72px}
    .project-section .work-grid{grid-template-columns:minmax(0,1fr)}
    .project-section .work-card{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);align-items:stretch}
    .project-section .thumb{height:100%;min-height:280px;aspect-ratio:auto;background:#f1efec}
    .project-section .thumb img{object-fit:contain}
    .project-section[data-category="detail"] .thumb{background:#f8efe2}
    .project-section[data-category="cardnews"] .thumb{background:#21133d}
    .project-section .work-copy{align-content:center;padding:clamp(24px,5vw,64px)}
    .work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
    .work-card{display:block;width:100%;padding:0;overflow:hidden;border:1px solid rgba(117,98,176,.15);border-radius:14px;background:rgba(255,253,250,.87);text-align:left;color:inherit;cursor:pointer;touch-action:manipulation;box-shadow:0 12px 36px rgba(91,74,137,.06);transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}
    .work-card:hover{transform:translateY(-5px);border-color:rgba(117,98,176,.4);box-shadow:0 20px 44px rgba(91,74,137,.13)}
    .work-card:focus-visible,.back-link:focus-visible,.close-button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .thumb{position:relative;display:block;aspect-ratio:1.45/1;overflow:hidden;background:linear-gradient(145deg,#eee8f8,#f8e7ed)}.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}.work-card:hover .thumb img{transform:scale(1.035)}
    .work-copy{display:grid;gap:7px;padding:22px 24px 25px}.work-type{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.08em}.work-title{font-size:clamp(17px,2vw,21px);font-weight:580;line-height:1.4;word-break:keep-all}.work-tools{color:var(--muted);font-size:11px}
    .image-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:25px;background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.8),transparent 58%),linear-gradient(145deg,#eee8f8,#f8e7ed);color:#655b7c;text-align:center;font-size:14px;font-weight:550;line-height:1.6;word-break:keep-all}
    .page-footer{display:flex;justify-content:space-between;gap:16px;margin-top:74px;padding-top:16px;border-top:1px solid var(--line);color:#8d817e;font-size:10px;letter-spacing:.04em}
    .modal[hidden]{display:none}.modal{position:fixed;z-index:10;inset:0;overflow:auto;padding:24px;background:rgba(58,49,77,.78)}.modal-shell{width:min(1100px,100%);min-height:80vh;margin:0 auto;background:#fbf9ff;box-shadow:0 24px 80px rgba(40,25,55,.2)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 26px;background:rgba(251,249,255,.95);border-bottom:1px solid var(--line)}.modal-title{font-size:15px;font-weight:650}.modal-sub{margin-top:3px;color:var(--muted);font-size:11px}
    .close-button{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:transparent;color:#544b49;font-size:24px;line-height:1;cursor:pointer}.modal-body{display:grid;gap:22px;padding:30px}.modal-body img{width:100%;height:auto;box-shadow:0 12px 38px rgba(54,38,38,.1)}.modal-body .image-fallback{position:relative;min-height:260px}body.modal-open{overflow:hidden}
    @media(max-width:700px){.topbar{min-height:64px;padding:max(12px,env(safe-area-inset-top)) 16px 12px;gap:8px}.brand{font-size:12px;white-space:nowrap}.back-link{font-size:11px;white-space:nowrap}main{padding:44px 16px max(64px,env(safe-area-inset-bottom))}.intro{margin-bottom:40px}.intro-copy{font-size:14px;line-height:1.75}.section-heading{align-items:start;flex-direction:column;gap:5px;margin-bottom:18px}.work-grid{grid-template-columns:1fr;gap:16px}.project-section+.project-section{margin-top:54px}.project-section .work-card{grid-template-columns:1fr}.project-section .thumb{min-height:0;aspect-ratio:1.25/1}.project-section .work-copy{padding:18px 18px 20px}.work-copy{padding:18px 18px 20px}.work-title{font-size:18px;line-height:1.45}.work-tools{line-height:1.6}.page-footer{flex-direction:column;gap:5px;margin-top:48px}.modal{padding:0;overscroll-behavior:contain}.modal-shell{min-height:100dvh}.modal-head{position:sticky;top:0;z-index:1;align-items:flex-start;gap:10px;padding:14px 16px max(14px,env(safe-area-inset-top))}.modal-title{font-size:14px;line-height:1.45;overflow-wrap:anywhere}.close-button{flex:0 0 44px;width:44px;height:44px;touch-action:manipulation}.modal-body{gap:14px;padding:16px 16px max(20px,env(safe-area-inset-bottom))}}
    @media(max-width:360px){.topbar{padding-inline:12px}.brand{font-size:11px}.back-link{font-size:10px;gap:5px}main{padding-inline:14px}.work-copy{padding:16px}.modal-body{padding-inline:12px}}
    @media(hover:none){.work-card:hover{transform:none;box-shadow:0 12px 36px rgba(91,74,137,.06)}.work-card:active{transform:scale(.995)}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html#about">한슬기 · 디자인 포트폴리오</a><a class="back-link" href="index.html#about"><span aria-hidden="true">←</span> 메인으로</a></header>
  <main>
    <section class="intro" aria-labelledby="pageTitle"><p class="eyebrow">WEB · DIGITAL DESIGN</p><h1 id="pageTitle">웹 · 디지털</h1><p class="intro-copy">매체의 특성과 사용자의 흐름을 고려해 화면에서 만나는 브랜드 경험을 설계합니다.</p><div class="intro-rule" aria-hidden="true"></div></section>
    <section class="project-section" data-category="detail" aria-labelledby="detailHeading">
      <div class="section-heading"><h2 id="detailHeading">상세페이지</h2><p>제품의 특징을 한눈에 이해하도록 정보와 비주얼을 구성했습니다.</p></div>
      <div class="work-grid">
        <button class="work-card" type="button" data-project="wdress"><span class="thumb"><img src="assets/digital/wdress-01.jpg" alt="더블유 드레스룸 내추럴 라이프 핸드크림 상세페이지" /></span><span class="work-copy"><span class="work-type">상품 상세페이지 · 뷰티</span><span class="work-title">더블유 드레스룸 내추럴 라이프 핸드크림</span><span class="work-tools">제품 스토리 · 향 정보 · 사용법 · 상품 정보</span></span></button>
      </div>
    </section>
    <section class="project-section" data-category="cardnews" aria-labelledby="cardnewsHeading">
      <div class="section-heading"><h2 id="cardnewsHeading">카드뉴스</h2><p>교육 과정의 정보를 모바일 화면에 맞춰 쉽게 전달합니다.</p></div>
      <div class="work-grid">
        <button class="work-card" type="button" data-project="ai"><span class="thumb"><img src="assets/digital/cardnews-01.png" alt="AI 응용 웹·앱 프로그램 매니저 양성과정 카드뉴스 모음" /></span><span class="work-copy"><span class="work-type">카드뉴스 · 교육 콘텐츠</span><span class="work-title">AI 응용 웹·앱 프로그램 매니저 양성과정</span><span class="work-tools">교육 과정 · 교육 특징 · 커리큘럼 · 접수 안내</span></span></button>
      </div>
    </section>
    <section class="project-section" data-category="website" aria-labelledby="websiteHeading">
      <div class="section-heading"><h2 id="websiteHeading">홈페이지 리뉴얼</h2><p>기업의 브랜드와 서비스 흐름을 디지털 경험으로 새롭게 정리했습니다.</p></div>
      <div class="work-grid">
        <button class="work-card" type="button" data-project="samwon"><span class="thumb"><img src="assets/digital/samwon-01.png" alt="삼원기업 홈페이지 리뉴얼 메인 화면 목업" /></span><span class="work-copy"><span class="work-type">홈페이지 리뉴얼 · 반응형 웹</span><span class="work-title">삼원기업 홈페이지 리뉴얼</span><span class="work-tools">브랜드 메인 · 서비스 소개 · 디지털 게시판 · 화면 설계</span></span></button>
      </div>
    </section>
    <footer class="page-footer"><span>한슬기 · 디자인 포트폴리오 2026</span><span>그래픽 · 편집 · 웹 디자이너</span></footer>
  </main>
  <div class="modal" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true" hidden><div class="modal-shell"><div class="modal-head"><div><div class="modal-title" id="modalTitle"></div><div class="modal-sub" id="modalSub"></div></div><button class="close-button" id="modalClose" type="button" aria-label="프로젝트 닫기">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
  <script>
    const projects={
      wdress:{title:'더블유 드레스룸 내추럴 라이프 핸드크림',sub:'상품 상세페이지 · 제품 스토리와 구매 정보',images:['assets/digital/wdress-01.jpg','assets/digital/wdress-02.jpg']},
      ai:{title:'AI 응용 웹·앱 프로그램 매니저 양성과정',sub:'카드뉴스 · 교육 과정 안내 콘텐츠',images:['assets/digital/cardnews-01.png','assets/digital/cardnews-02.png','assets/digital/cardnews-03.png']},
      samwon:{title:'삼원기업 홈페이지 리뉴얼',sub:'기업 홈페이지 · 서비스 경험과 반응형 화면',images:['assets/digital/samwon-01.png','assets/digital/samwon-02.png','assets/digital/samwon-03.png','assets/digital/samwon-04.png']}
    };
    const modal=document.getElementById('projectModal'),modalTitle=document.getElementById('modalTitle'),modalSub=document.getElementById('modalSub'),modalBody=document.getElementById('modalBody'),modalClose=document.getElementById('modalClose');
    let activeCard=null;
    function showImageFallback(img){img.hidden=true;const fallback=document.createElement('div');fallback.className='image-fallback';fallback.textContent=`${img.alt} · 이미지 파일을 찾을 수 없습니다`;img.parentElement.append(fallback)}
    document.querySelectorAll('.thumb img').forEach(img=>img.addEventListener('error',()=>showImageFallback(img),{once:true}));
    document.querySelectorAll('[data-project]').forEach(card=>card.addEventListener('click',()=>{
      const project=projects[card.dataset.project];if(!project)return;
      activeCard=card;modalTitle.textContent=project.title;modalSub.textContent=project.sub;
      modalBody.replaceChildren(...project.images.map((src,index)=>{const img=document.createElement('img');img.src=src;img.alt=`${project.title} 상세 ${index+1}`;img.loading='lazy';img.addEventListener('error',()=>showImageFallback(img),{once:true});return img}));
      modal.hidden=false;modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');modalClose.focus();
    }));
    function closeModal(){modal.hidden=true;modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');activeCard?.focus()}
    modalClose.addEventListener('click',closeModal);modal.addEventListener('click',event=>{if(event.target===modal)closeModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.hidden)closeModal()});
  </script>
</body>
</html>
